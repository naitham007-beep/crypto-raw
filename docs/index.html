<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข็มทิศออปชัน BTC · ETH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1c1b19; --mute:#6b6862; --line:#e4e1da;
  --green:#1f7a4d; --green-bg:#e6f3ec; --amber:#9a6200; --amber-bg:#fbf1dc;
  --gray:#6b6862; --gray-bg:#efede8; --red:#b3261e; --red-bg:#fbe9e7; --accent:#2a4bd7;
  --violet:#6b3fb8; --violet-bg:#f1ebfb; --blue:#1d5fb8; --teal:#1f6f78;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14140f; --card:#1d1d18; --ink:#ecebe6; --mute:#a3a097; --line:#33322b;
    --green:#5fcf94; --green-bg:#16301f; --amber:#f0b64d; --amber-bg:#352910;
    --gray:#a3a097; --gray-bg:#26261f; --red:#ff8a80; --red-bg:#3a1b18; --accent:#8ea4ff;
    --violet:#c7a6ff; --violet-bg:#2a2140; --blue:#8ab8ff; --teal:#6fd0d8; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 "IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:4px 0}
.stamp{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:6px;margin:14px 0}
.tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tab small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.stale{background:var(--red-bg);color:var(--red);border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:600}
section{margin-top:22px}
h2{font-size:13px;letter-spacing:.04em;color:var(--mute);margin:0 0 8px;font-weight:600}
.mode{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.mode .big{font-size:24px;font-weight:700;display:flex;gap:10px;align-items:center}
.mode .why{color:var(--mute);margin:4px 0 12px}
.mode .do{border-left:4px solid var(--ink);padding:8px 12px;background:var(--gray-bg);border-radius:0 8px 8px 0;font-weight:500}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px}
.kv b{display:block;font-size:17px}
.kv span{font-size:12px;color:var(--mute)}
.check{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.check .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.check .t{font-weight:600}
.check .fact{font-variant-numeric:tabular-nums;margin:4px 0}
.check .means{margin:6px 0 0}
.check .note{font-size:12.5px;color:var(--mute);margin-top:6px}
.badge{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-proven{background:var(--green-bg);color:var(--green)}
.b-weak{background:var(--amber-bg);color:var(--amber)}
.b-none{background:var(--gray-bg);color:var(--gray)}
.check.proven{border-left:4px solid var(--green)}
.legend{font-size:12.5px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--mute);font-weight:600;font-size:12.5px}
tr:last-child td{border-bottom:0}
.up{color:var(--green)} .dn{color:var(--red)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.sum ul{margin:6px 0 0;padding-left:20px}
.sum li{margin:4px 0}
footer{margin-top:28px;font-size:12.5px;color:var(--mute)}
footer a{color:var(--accent)}
.err{background:var(--red-bg);color:var(--red);padding:14px;border-radius:12px}
.note{font-size:12.5px;color:var(--mute);margin-top:6px}
.ls{font-size:12px;color:var(--mute)}
.guide-link{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600}
.guide-link span{color:var(--accent)}
.guide-link:hover{border-color:var(--accent)}
.live{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--mute)}
.live::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--gray)}
.live.on::before{background:var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.live.on::before{animation:none}}
[data-px]{border-radius:6px;padding:0 3px}
@keyframes flashUp{0%{background:color-mix(in oklab,var(--green) 30%,transparent)}100%{background:transparent}}
@keyframes flashDn{0%{background:color-mix(in oklab,var(--red) 30%,transparent)}100%{background:transparent}}
.flash-up{animation:flashUp 1.2s ease-out}
.flash-dn{animation:flashDn 1.2s ease-out}
@media (prefers-reduced-motion: reduce){.flash-up,.flash-dn{animation:none}}
/* ⓪ bias + แผนที่ราคา */
.bias{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gray);border-radius:14px;padding:14px 16px}
.bias.b-up{border-left-color:var(--green)} .bias.b-dn{border-left-color:var(--red)}
.bias .big{font-size:22px;font-weight:700}
.bias .big small{font-size:13px;color:var(--mute);font-weight:500}
.bias .why{margin:6px 0 0}
.ctxh{margin:14px 0 4px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctx{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.arr{flex:none;width:20px;text-align:center;font-weight:700}
.arr.up{color:var(--green)} .arr.down{color:var(--red)} .arr.flat{color:var(--mute)}
.pricebox{margin:16px 0 10px}
.pricebox label{font-size:13px;color:var(--mute)}
.pxrow{display:flex;gap:8px;margin-top:4px}
.pxrow input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:700;padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.pxrow button{font:inherit;font-size:13px;padding:0 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--mute);cursor:pointer;white-space:nowrap}
.where{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.where .wt{font-weight:700;font-size:16px}
.where.in{background:var(--violet-bg);border-color:var(--violet)}
.where .more{margin-top:6px;font-size:13.5px}
.zones{display:grid;gap:8px;margin-bottom:10px}
.zone{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gray);border-radius:12px;padding:9px 14px}
.zone.res{border-left-color:var(--red)} .zone.sup{border-left-color:var(--green)} .zone.in{border-left-color:var(--violet)}
.zone .zt{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-variant-numeric:tabular-nums}
.ladder{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lv{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;padding:8px 12px;
  border-bottom:1px solid var(--line);border-left:4px solid var(--line)}
.lv:last-child{border-bottom:0}
.lv b{font-variant-numeric:tabular-nums;font-size:16px}
.lv .lt{font-weight:600;font-size:14px;line-height:1.35}
.lv > span{font-variant-numeric:tabular-nums;font-size:13px}
.lv.now{background:var(--gray-bg);border-left-color:var(--ink)}
.lv.c-red{border-left-color:var(--red)} .lv.c-red b{color:var(--red)}
.lv.c-green{border-left-color:var(--green)} .lv.c-green b{color:var(--green)}
.lv.c-amber{border-left-color:var(--amber)} .lv.c-amber b{color:var(--amber)}
.lv.c-violet{border-left-color:var(--violet)} .lv.c-violet b{color:var(--violet)}
.lv.c-blue{border-left-color:var(--blue)} .lv.c-blue b{color:var(--blue)}
.lv.c-teal{border-left-color:var(--teal)} .lv.c-teal b{color:var(--teal)}
.lv.c-gray b{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧭 เข็มทิศออปชัน</h1>
    <div class="stamp" id="stamp">กำลังโหลด…</div>
  </header>
  <a class="guide-link" href="guide.html">📖 มือใหม่? อ่านแบบเข้าใจง่าย <span>→</span></a>
  <div class="live" id="live"></div>
  <div id="stale" class="stale" hidden></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <main id="main"></main>
  <footer>
    อัพเดทอัตโนมัติทุก 2 ชม. จากข้อมูลสาธารณะของ OKX · Binance · Deribit ·
    <a href="guide.html">อ่านแบบเข้าใจง่าย →</a><br>
    หน้านี้บอกสภาพตลาดและระดับหลักฐานของแต่ละข้อ — ไม่ใช่คำแนะนำการลงทุน การตัดสินใจเข้า/ออกเป็นของผู้ใช้เอง
  </footer>
</div>

<script>
// หา owner/repo จากลิงก์ที่เปิดอยู่ (xxx.github.io/<repo>) — ย้าย repo ไปองค์กรไหนหน้าก็ยังชี้ถูก ไม่ต้องแก้โค้ด
const REPO = (() => {
  const h = location.hostname, seg = location.pathname.split("/").filter(Boolean)[0];
  if (h.endsWith(".github.io") && seg) return h.split(".")[0] + "/" + seg;
  return "korntrade/crypto-raw";
})();
// ?data=ไฟล์.json ใช้ทดสอบหน้าเว็บกับข้อมูลจำลองในเครื่อง ก่อนตัวคำนวณบน cloud จะรันจริง
const DATA_OVERRIDE = new URLSearchParams(location.search).get("data");
// ดึงผ่าน GitHub API ก่อน — raw.githubusercontent แคชแยกตามจุด CDN (เจอ 11 ก.ย.: บางจุดยังส่งข้อมูลเก่า 2 ชม. หลังอัพเดทไปแล้ว)
// API ไม่มีแคชแต่จำกัด 60 ครั้ง/ชม./IP → โดนจำกัดเมื่อไหร่ค่อยถอยไปใช้ raw
const API_URL = "https://api.github.com/repos/" + REPO + "/contents/web/latest.json?ref=main";
const RAW_URL = "https://raw.githubusercontent.com/" + REPO + "/main/web/latest.json";

// ระดับออปชันจาก Worker ทุก 15 นาที (ขั้น ② · 11 ก.ย.) — ใหม่กว่ารอบ 2 ชม. ของ compute.py ก็ใช้แทน
// ยกเว้นกรอบ 1SD (ยึดรอบ 2 ชม. — คำนวณใหม่ถี่ๆ กรอบจะวิ่งตามราคา) · ดึงไม่ได้ = ใช้ของเดิมเงียบๆ
const WORKER_LEVELS = "https://crypto-raw-waker.korntrade.workers.dev/levels";
async function mergeWorkerLevels(D) {
  if (DATA_OVERRIDE) return;
  try {
    const r = await fetch(WORKER_LEVELS, {cache: "no-store"});
    if (!r.ok) return;
    const lv = await r.json(), ghAt = Date.parse(D.generated_at_utc);
    let newest = 0;
    for (const s of Object.keys(D.symbols || {})) {
      const f = lv.symbols && lv.symbols[s], at = f ? Date.parse(f.at) : 0;
      if (!f || !f.options || !(at > ghAt) || Date.now() - at > 2 * 36e5) continue;
      const {sd1_move, sd1_range, ...rest} = f.options;
      const base = D.symbols[s].options || {};
      // ชุดสัญญาต่างกัน (ช่วง 3 ชม.ก่อนหมดอายุ) → กรอบ 1SD ของชุดเก่าผูกกับวันหมดอายุคนละวัน ซ่อนไว้จนรอบ 2 ชม.ถัดไป
      D.symbols[s].options = {...base, ...rest, ...(base.expiry === rest.expiry ? {} : {sd1_range: null, sd1_move: null})};
      newest = Math.max(newest, at);
    }
    if (newest) D.__levelsAt = new Date(newest).toISOString();
  } catch (e) { /* ใช้ระดับจากรอบ 2 ชม. */ }
}

async function fetchData() {
  const bust = u => u + (u.includes("?") ? "&" : "?") + "t=" + Date.now();
  if (DATA_OVERRIDE) {
    const r = await fetch(bust(DATA_OVERRIDE), {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
  try {
    const r = await fetch(API_URL, {cache: "no-store"});
    if (r.ok) {
      const c = await r.json();
      const bytes = Uint8Array.from(atob((c.content || "").replace(/\n/g, "")), ch => ch.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }
  } catch (e) { /* ตกไปใช้ raw */ }
  const r = await fetch(bust(RAW_URL), {cache: "no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
const STALE_HOURS = 3;
const EV = {
  proven: ["✅ พิสูจน์แล้ว", "b-proven"],
  weak:   ["🟡 ใช้ประกอบ", "b-weak"],
  none:   ["⬜ ยังไม่มีสถิติ", "b-none"],
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v, d = 0) => v == null || isNaN(v) ? "—" : Number(v).toLocaleString("th-TH", {maximumFractionDigits: d, minimumFractionDigits: d});
const thTime = iso => new Date(iso).toLocaleString("th-TH", {timeZone: "Asia/Bangkok", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});

let DATA = null, CUR = "BTC", DATA_LOADED_ONCE = false;
const PX = {};   // ราคาที่ผู้ใช้กรอกเอง แยกรายเหรียญ (ไม่มี = ใช้ราคาล่าสุด)
try { CUR = localStorage.getItem("coin") || "BTC"; } catch (e) {}

async function load() {
  try {
    const fresh = await fetchData();
    await mergeWorkerLevels(fresh);
    DATA = fresh;
    // กำลังพิมพ์ราคาอยู่ → ไม่วาดหน้าใหม่ทับ (ช่องกรอกจะหลุดโฟกัส) · รอบถัดไปค่อยวาด
    if (!DATA_LOADED_ONCE || document.activeElement?.id !== "px") render();
    DATA_LOADED_ONCE = true;
  } catch (e) {
    $("#main").innerHTML = `<div class="err">โหลดข้อมูลไม่ได้ (${esc(e.message)}) — ลองรีเฟรชอีกครั้ง</div>`;
    $("#stamp").textContent = "";
  }
}

function render() {
  const gen = new Date(DATA.generated_at_utc);
  const ageH = (Date.now() - gen) / 36e5;
  $("#stamp").textContent = "ข้อมูล ณ " + thTime(DATA.generated_at_utc) + " น.";
  const st = $("#stale");
  st.hidden = ageH < STALE_HOURS;
  st.textContent = `⚠️ ข้อมูลเก่า ${fmt(ageH, 1)} ชม. — ตัวเก็บอาจสะดุด อย่าใช้ตัดสินใจจนกว่าจะอัพเดท`;

  const syms = Object.keys(DATA.symbols);
  if (!syms.includes(CUR)) CUR = syms[0];
  $("#tabs").innerHTML = syms.map(s => {
    const d = DATA.symbols[s];
    const ch = liveChg(s) ?? d.change_24h;
    return `<button class="tab" role="tab" aria-selected="${s === CUR}" data-s="${s}">
      ${s} <span data-px="${s}" data-v="${spotOf(d, s)}">${fmt(spotOf(d, s), 2)}</span>
      <small>${d.mode.icon} ${esc(d.mode.mode)} · <span data-chg="${s}" class="${ch >= 0 ? "up" : "dn"}">${ch >= 0 ? "+" : ""}${fmt(ch, 2)}% 24ชม.</span></small>
    </button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    CUR = b.dataset.s;
    try { localStorage.setItem("coin", CUR); } catch (e) {}
    render();
  });

  const d = DATA.symbols[CUR];
  const o = d.options || {};
  const dp = CUR === "BTC" ? 0 : 1;
  $("#main").innerHTML = `
    <section>
      <h2>⓪ Bias ทิศทาง + แผนที่ราคา</h2>
      ${biasCard(d)}
      <div class="pricebox">
        <label for="px">ราคาที่อยากดู (แก้ได้ — ระดับทั้งหมดจะเทียบกับราคานี้)</label>
        <div class="pxrow">
          <input id="px" inputmode="decimal" autocomplete="off" value="${PX[CUR] ?? spotOf(d, CUR).toFixed(dp)}">
          <button id="pxReset" type="button">↺ ใช้ราคาสด</button>
        </div>
      </div>
      <div id="map"></div>
    </section>

    <section>
      <h2>① ตอนนี้ตลาดอยู่โหมดไหน</h2>
      <div class="mode">
        <div class="big">${d.mode.icon} ${esc(d.mode.mode)}</div>
        <div class="why">${esc(d.mode.why)}</div>
        <div class="do">▶ ${esc(d.mode.do)}</div>
        <div class="kv">
          <div><span>max pain</span><b>${fv(o.max_pain)}</b></div>
          <div><span>โซนตรึง</span><b>${o.pin_zone ? fv(o.pin_zone[0]) + "–" + fv(o.pin_zone[1]) : "—"}</b></div>
          <div><span>กำแพง put / call</span><b>${fv(o.put_wall)} / ${fv(o.call_wall)}</b></div>
          <div><span>ออปชันชุดนี้หมดอายุ ${o.expiry_utc ? esc(thTime(o.expiry_utc)) + " น." : ""}</span><b>อีก ${fmt(o.hours_left, 1)} ชม.</b></div>
        </div>
      </div>
    </section>

    <section>
      <h2>② เช็กลิสต์ก่อนตัดสินใจ</h2>
      <div class="legend"><span>✅ พิสูจน์แล้วด้วยข้อมูลย้อนหลัง</span><span>🟡 ใช้ประกอบ ห้ามใช้เดี่ยว</span><span>⬜ ข้อเท็จจริงเท่านั้น ยังไม่มีสถิติ</span></div>
      ${d.checks.map(c => `
        <div class="check ${c.evidence}">
          <div class="top"><div class="t">${esc(c.title)}</div><span class="badge ${EV[c.evidence][1]}">${EV[c.evidence][0]}</span></div>
          <div class="fact">${esc(c.fact)}</div>
          <div class="means">→ ${esc(c.means)}</div>
          <div class="note">${esc(c.evidence_note)}</div>
        </div>`).join("")}
    </section>

    <section>
      <h2>③ อะไรเปลี่ยนไปบ้าง</h2>
      ${timeline(d)}
    </section>

    <section>
      <h2>④ สรุป — ข้อที่กล้าเอาไปใช้จริง</h2>
      ${summary(d)}
    </section>`;

  const px = $("#px");
  px.oninput = () => {
    const v = parseFloat(px.value.replace(/[^\d.]/g, ""));
    if (isFinite(v) && v > 0) { PX[CUR] = v; renderMap(); }
  };
  $("#pxReset").onclick = () => { delete PX[CUR]; px.value = spotOf(d, CUR).toFixed(dp); renderMap(); };
  renderMap();
  liveBadge();
}

// ---------- ⓪ bias ----------
function biasCard(d) {
  const b = d.bias;
  if (!b) return `<div class="sum">bias จะแสดงหลังตัวคำนวณรันรอบถัดไป</div>`;
  const p = b.proven;
  const until = new Date(new Date(DATA.generated_at_utc).getTime() + 8 * 36e5);
  const head = p ? (p.dir === "up" ? ["🔺", "เอียงขึ้น", "b-up"] : ["🔻", "เอียงลง", "b-dn"])
                 : ["➖", "ไม่มี bias ที่พิสูจน์แล้ว", ""];
  let body;
  if (p) {
    const other = p.dir === "up" ? `ยังปิดต่ำลงได้ ${fmt(100 - p.up8h, 1)}% ของครั้ง` : `ยังปิดสูงขึ้นได้ ${fmt(p.up8h, 1)}% ของครั้ง`;
    const agree = b.context.filter(c => c.dir === p.dir).length;
    const against = b.context.filter(c => c.dir !== "flat" && c.dir !== p.dir).length;
    body = `
      <div class="why"><b>เพราะ</b> ${esc(p.why)} — ${esc(p.stat)} <span class="badge b-proven">✅ พิสูจน์แล้ว</span></div>
      <div class="note">n=${p.n} · ${esc(p.window)} · แบ่งครึ่งตัวอย่าง ${(p.halves || []).map(h => fmt(h, 1) + "%").join(" / ")}
        · ใช้ได้ถึง ${esc(thTime(until))} น.${Date.now() > until ? " — ⚠️ หมดช่วงแล้ว รอข้อมูลรอบใหม่" : ""}
        · เอียง ≠ แน่นอน: ${other} · ตัวอย่างมาจากช่วงตลาดเดียว 3 เดือน</div>
      <div class="note">บริบทด้านล่าง: หนุน ${agree} · ขัด ${against}</div>`;
  } else {
    body = `<div class="why">ตอนนี้ไม่มีข้อไหนที่ผ่านการพิสูจน์ชี้ทิศทาง — บริบทด้านล่างเป็นข้อเท็จจริงประกอบ ห้ามนับรวมเป็นสัญญาณแทน</div>`;
  }
  return `<div class="bias ${head[2]}">
    <div class="big">${head[0]} ${head[1]}${p ? " <small>ช่วง 8 ชม.</small>" : ""}</div>
    ${body}
    <div class="ctxh">บริบทประกอบ <span class="badge b-none">⬜ ยังไม่มีสถิติ</span></div>
    ${b.context.map(c => `<div class="ctx"><span class="arr ${c.dir}">${c.dir === "up" ? "▲" : c.dir === "down" ? "▼" : "–"}</span>
      <div><b>${esc(c.name)}</b><div class="ls">${esc(c.fact)}</div></div></div>`).join("")}
  </div>`;
}

// ---------- ⓪ แผนที่ราคา ----------
// ตัวเลขระดับราคา: strike ออปชันเป็นเลขกลม (2,450) ไม่ต้องโชว์ .0 · ค่าที่คำนวณได้ (EMA/ATR/1SD) โชว์ทศนิยมตามเหรียญ
const fv = v => fmt(v, Number.isInteger(+v) ? 0 : (CUR === "BTC" ? 0 : 1));

function levels(d) {
  const o = d.options || {}, v = d.vol || {}, L = [];
  const dp = CUR === "BTC" ? 0 : 1;
  const add = (val, src, label, sub, cls, short) => {
    if (val != null && isFinite(val)) L.push({val: +val, src, label, sub, cls, short});
  };
  const exp = o.expiry_utc ? thTime(o.expiry_utc) + " น." : "หมดอายุ";
  add(o.call_wall, "wall", "กำแพงบน — call OI หนาสุด", o.call_wall_oi != null ? `OI ${fmt(o.call_wall_oi, 1)} ${CUR}` : "", "c-red", "กำแพง call");
  add(o.max_pain, "mp", "max pain", `ราคาที่คนถือออปชันเจ็บรวมมากสุด ณ ${exp}`, "c-amber", "max pain");
  if (o.pin_zone) {
    add(o.pin_zone[1], "pin", "ขอบบนโซนตรึง (GEX)", "ในโซนมักถูกดูดกลับเข้ากลาง", "c-violet", "ขอบบนโซนตรึง");
    add(o.pin_zone[0], "pin", "ขอบล่างโซนตรึง (GEX)", "หลุดโซน = แรงตรึงอ่อนลง", "c-violet", "ขอบล่างโซนตรึง");
  }
  if (o.sd1_range) {
    add(o.sd1_range[1], "sd1", "ขอบบนกรอบ 1SD", `ตลาดออปชันตั้งราคาไว้ถึง ${exp}`, "c-blue", "ขอบบน 1SD");
    add(o.sd1_range[0], "sd1", "ขอบล่างกรอบ 1SD", `ตลาดออปชันตั้งราคาไว้ถึง ${exp}`, "c-blue", "ขอบล่าง 1SD");
  }
  add(o.put_wall, "wall", "กำแพงล่าง — put OI หนาสุด", o.put_wall_oi != null ? `OI ${fmt(o.put_wall_oi, 1)} ${CUR}` : "", "c-green", "กำแพง put");
  const atr = v.atr14_prev ?? v.atr14;
  if (atr) {
    if (v.day_high != null && v.day_low != null) {
      const used = (v.day_high - v.day_low) / atr * 100;
      // ช่วงแกว่งเต็มวัน: ต่ำสุดของวัน + ATR = สูงสุดที่ยังไปได้ถ้าวิ่งแค่ขนาดปกติ (กลับกันสำหรับพื้น)
      if (used < 100) {
        const note = `ATR ${fmt(atr, dp)} · วันนี้ใช้ไป ${fmt(used, 0)}%`;
        add(v.day_low + atr, "atr", "เพดานช่วงแกว่งเต็มวัน", "ต่ำสุดวันนี้ + " + note, "c-gray", "เพดาน ATR");
        add(v.day_high - atr, "atr", "พื้นช่วงแกว่งเต็มวัน", "สูงสุดวันนี้ − " + note, "c-gray", "พื้น ATR");
      }
    } else {
      add(d.spot + atr, "atr", "เพดานช่วงแกว่งเต็มวัน", `ราคาล่าสุด + ATR ${fmt(atr, dp)}`, "c-gray", "เพดาน ATR");
      add(d.spot - atr, "atr", "พื้นช่วงแกว่งเต็มวัน", `ราคาล่าสุด − ATR ${fmt(atr, dp)}`, "c-gray", "พื้น ATR");
    }
  }
  add(v.ema30, "ema30", "EMA30 (1D)", "ยืนเหนือเส้น = ยังเป็นขาขึ้นระยะกลาง", "c-teal", "EMA30");
  add(v.ema200, "ema200", "EMA200 (1D)", "ยืนเหนือเส้น = ยังเป็นขาขึ้นระยะยาว", "c-teal", "EMA200");
  return L.sort((a, b) => b.val - a.val);
}

// โซนน่าสนใจ = ระดับจากเครื่องมือต่างชนิดกันตั้งแต่ 2 ตัวขึ้นไปมากองใกล้กัน (ห่างกันไม่เกิน tol)
function zones(L, tol) {
  const s = [...L].sort((a, b) => a.val - b.val), groups = [];
  let cur = [];
  for (const l of s) {
    if (cur.length && (l.val - cur[cur.length - 1].val > tol || l.val - cur[0].val > 2 * tol)) { groups.push(cur); cur = []; }
    cur.push(l);
  }
  if (cur.length) groups.push(cur);
  return groups.map(g => ({lo: g[0].val, hi: g[g.length - 1].val, items: g, srcs: new Set(g.map(x => x.src)).size}))
    .filter(z => z.srcs >= 2);
}

function where(d, P) {
  const o = d.options || {}, out = [];
  if (o.pin_zone) {
    const [lo, hi] = o.pin_zone, rng = `${fv(lo)} – ${fv(hi)}`;
    if (P >= lo && P <= hi) out.push({cls: "in", t: "🧲 อยู่ในโซนตรึง (GEX)", s: `${rng} · แรงออปชันมักดึงกลับเข้ากลาง — ไล่ราคาในโซนมักโดนดึงกลับ`});
    else out.push({cls: "", t: P > hi ? "⬆ อยู่เหนือโซนตรึง" : "⬇ อยู่ใต้โซนตรึง", s: `โซน ${rng} · นอกโซนแรงตรึงอ่อนลง ราคาวิ่งได้อิสระกว่า`});
  }
  if (o.sd1_range && (P > o.sd1_range[1] || P < o.sd1_range[0]))
    out.push({t: "⚡ หลุดกรอบ 1SD", s: "เคลื่อนแรงกว่าที่ตลาดออปชันตั้งราคาไว้"});
  if (o.call_wall && P >= o.call_wall) out.push({t: "🧱 ทะลุกำแพง call", s: `เหนือ ${fv(o.call_wall)} — คนขาย call ต้องไล่ซื้อป้องกันความเสี่ยง`});
  if (o.put_wall && P <= o.put_wall) out.push({t: "🧱 หลุดกำแพง put", s: `ใต้ ${fv(o.put_wall)} — คนขาย put ต้องไล่ขายป้องกันความเสี่ยง`});
  if (o.max_pain) {
    const g = (o.max_pain - P) / P * 100;
    out.push({t: "", s: `max pain อยู่${g >= 0 ? "เหนือ" : "ใต้"}ราคานี้ ${fmt(Math.abs(g), 1)}%`});
  }
  return out;
}

function renderMap() {
  const d = DATA.symbols[CUR], dp = CUR === "BTC" ? 0 : 1, v = d.vol || {};
  const P = PX[CUR] ?? spotOf(d, CUR);
  const L = levels(d);
  if (!L.length) { $("#map").innerHTML = `<div class="sum">ข้อมูลชุดนี้ยังไม่มีระดับราคาให้วาด</div>`; return; }
  const pct = x => { const g = (x - P) / P * 100; return `<span class="${g >= 0 ? "up" : "dn"}">${g >= 0 ? "+" : ""}${fmt(g, 1)}%</span>`; };

  const W = where(d, P), main = W.find(w => w.t) || {t: "", s: ""};
  const rest = W.filter(w => w !== main);
  const whereHtml = `<div class="where ${main.cls || ""}">
    <div class="wt">${esc(main.t)}</div><div>${esc(main.s)}</div>
    ${rest.length ? `<div class="more">${rest.map(w => `${w.t ? "<b>" + esc(w.t) + "</b> · " : ""}${esc(w.s)}`).join("<br>")}</div>` : ""}
  </div>`;

  const atr = v.atr14_prev ?? v.atr14;
  const tol = atr ? atr * 0.25 : P * 0.004;
  const Z = zones(L, tol);
  const zin = Z.filter(z => P >= z.lo && P <= z.hi);
  const zup = Z.filter(z => z.lo > P).sort((a, b) => a.lo - b.lo).slice(0, 2);
  const zdn = Z.filter(z => z.hi < P).sort((a, b) => b.hi - a.hi).slice(0, 2);
  const zRow = (z, kind) => {
    const rng = z.lo === z.hi ? fv(z.lo) : `${fv(z.lo)} – ${fv(z.hi)}`;
    const ref = kind === "res" ? z.lo : kind === "sup" ? z.hi : P;
    const name = kind === "res" ? "🔺 แนวต้าน" : kind === "sup" ? "🔻 แนวรับ" : "📍 ราคาอยู่ในโซน";
    return `<div class="zone ${kind}"><div class="zt"><span>${name} ${rng}</span>${kind === "in" ? "" : pct(ref)}</div>
      <div class="ls">${z.items.length} ระดับจาก ${z.srcs} เครื่องมือมากองรวมกัน: ${z.items.map(i => esc(i.short)).join(" · ")}</div></div>`;
  };
  const zoneHtml = (zin.length + zup.length + zdn.length)
    ? `<div class="ctxh">โซนน่าสนใจ <span class="badge b-none">⬜ ยังไม่มีสถิติว่าเด้งจริงกี่ %</span></div>
       <div class="zones">${zup.slice().reverse().map(z => zRow(z, "res")).join("")}${zin.map(z => zRow(z, "in")).join("")}${zdn.map(z => zRow(z, "sup")).join("")}</div>`
    : `<div class="note">ไม่มีโซนที่หลายเครื่องมือชี้ตรงกันใกล้ราคานี้</div>`;

  const above = L.filter(l => l.val > P), below = L.filter(l => l.val <= P);
  const row = l => `<div class="lv ${l.cls}"><b>${fv(l.val)}</b>
      <div><div class="lt">${esc(l.label)}</div>${l.sub ? `<div class="ls">${esc(l.sub)}</div>` : ""}</div>${pct(l.val)}</div>`;
  const ladder = `<div class="ctxh">แผนที่ราคา</div><div class="ladder">
    ${above.map(row).join("")}
    <div class="lv now"><b>${fmt(P, dp)}</b><div class="lt">⬅ ราคาที่ดู</div><span></span></div>
    ${below.map(row).join("")}
  </div>
  <div class="note">ระดับจากออปชัน (กำแพง · max pain · โซนตรึง · 1SD) ใช้ได้ถึงวันหมดอายุชุดนี้ และยังไม่มีสถิติของเราเองว่าราคาเคารพจริงกี่ % ·
    ATR และ EMA คำนวณจากราคาจริง เป็นข้อเท็จจริง ไม่ใช่คำทำนาย</div>`;

  $("#map").innerHTML = whereHtml + zoneHtml + ladder;
}

function timeline(d) {
  const tl = DATA.timeline || {};
  const cols = [["ตอนนี้", {spot: d.spot, funding: d.funding, options: d.options, vol: d.vol}]]
    .concat(["2h", "8h", "24h"].filter(k => tl[k] && tl[k].symbols && tl[k].symbols[CUR])
      .map(k => [k.replace("h", " ชม.ก่อน"), tl[k].symbols[CUR]]));
  if (cols.length < 2) {
    return `<div class="sum">ยังไม่มีข้อมูลย้อนหลังให้เทียบ — ตัวเก็บเพิ่งเริ่มทำงาน รอบถัดไป (อีก ~2 ชม.) จะเริ่มเห็นการเปลี่ยนแปลง</div>`;
  }
  const dp = CUR === "BTC" ? 0 : 1;
  const rows = [
    ["ราคา", x => fmt(x.spot, dp), x => x.spot],
    ["funding (เปอร์เซ็นไทล์)", x => x.funding ? fmt(x.funding.percentile, 0) : "—", x => x.funding && x.funding.percentile],
    ["สถานะค้าง (ล้าน $)", x => x.funding && x.funding.oi_usd ? fmt(x.funding.oi_usd / 1e6, 0) : "—", x => x.funding && x.funding.oi_usd],
    ["max pain", x => x.options ? fmt(x.options.max_pain, dp) : "—", x => x.options && x.options.max_pain],
    ["IV ที่ราคาปัจจุบัน %", x => x.options ? fmt(x.options.atm_iv, 1) : "—", x => x.options && x.options.atm_iv],
  ];
  const now = cols[0][1];
  return `<div class="tbl"><table>
    <thead><tr><th></th>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(([label, show, raw]) => `<tr><td>${label}</td>${cols.map((c, i) => {
      if (i === 0) return `<td><b>${show(c[1])}</b></td>`;
      const a = raw(now), b = raw(c[1]);
      const arrow = a != null && b != null && a !== b ? (a > b ? ' <span class="up">▲</span>' : ' <span class="dn">▼</span>') : "";
      return `<td>${show(c[1])}${arrow}</td>`;
    }).join("")}</tr>`).join("")}</tbody>
  </table></div>
  <div class="legend" style="margin-top:6px">▲▼ = ตอนนี้สูง/ต่ำกว่าช่วงนั้น</div>`;
}

function summary(d) {
  const proven = d.checks.filter(c => c.evidence === "proven");
  const weak = d.checks.filter(c => c.evidence === "weak").length;
  const none = d.checks.filter(c => c.evidence === "none").length;
  const list = proven.length
    ? `<ul>${proven.map(c => `<li><b>${esc(c.title)}:</b> ${esc(c.means)}</li>`).join("")}</ul>`
    : `<p>ตอนนี้ยังไม่มีข้อไหนที่มีหลักฐานพอให้ใช้ตัดสินใจเดี่ยวๆ</p>`;
  return `<div class="sum">
    <div>ข้อที่มีหลักฐานรองรับ <b>${proven.length}</b> ข้อ · ใช้ประกอบ <b>${weak}</b> ข้อ · ข้อเท็จจริงล้วน <b>${none}</b> ข้อ</div>
    ${list}
    <div class="note" style="margin-top:8px;color:var(--mute);font-size:12.5px">ข้อ 🟡 และ ⬜ ให้ใช้เป็นบริบท ไม่ใช่เหตุผลในการกดเข้า · สถิติจะแน่นขึ้นเรื่อยๆ เมื่อคลังสะสมข้อมูลมากขึ้น</div>
  </div>`;
}

// ---------- ราคาสด — Binance (เปิด CORS · ไม่โดนบล็อกในไทย) ทุก 3 วิ เฉพาะตอนเปิดหน้าอยู่ ----------
// ระดับออปชัน / bias / โหมด ยังมาจากรอบคำนวณทุก 2 ชม. — ราคาสดใช้บอกแค่ "ตอนนี้อยู่ตรงไหนของแผนที่"
const LIVE = {px: {}, chg: {}, at: 0};
const LIVE_URL = "https://data-api.binance.vision/api/v3/ticker/24hr?type=MINI&symbols=" + encodeURIComponent('["BTCUSDT","ETHUSDT"]');
let LIVE_T = null;
function liveOk() { return Date.now() - LIVE.at < 30000; }
function spotOf(d, s) { return (liveOk() && LIVE.px[s]) || d.spot; }
function liveChg(s) { return liveOk() && LIVE.chg[s] != null ? LIVE.chg[s] : null; }
async function pollLive() {
  try {
    const r = await fetch(LIVE_URL, {cache: "no-store"});
    if (r.ok) {
      (await r.json()).forEach(t => {
        const s = t.symbol.replace(/USDT$/, ""), last = +t.lastPrice, open = +t.openPrice;
        if (last > 0) { LIVE.px[s] = last; LIVE.chg[s] = open > 0 ? (last - open) / open * 100 : null; }
      });
      LIVE.at = Date.now();
    }
  } catch (e) { /* ดึงไม่ได้ → ใช้ราคา ณ รอบคำนวณแทน */ }
  if (DATA_LOADED_ONCE) onLive();
}
function startLive() { if (!LIVE_T) { pollLive(); LIVE_T = setInterval(pollLive, 3000); } }
function stopLive() { clearInterval(LIVE_T); LIVE_T = null; }
document.addEventListener("visibilitychange", () => document.hidden ? stopLive() : startLive());

function liveBadge() {
  const el = $("#live");
  if (!el || !DATA) return;
  // ระดับออปชันอาจมาจาก Worker (15 นาที) แต่ bias/โหมดมาจาก compute.py (2 ชม.) → แยกเวลาให้เห็นทั้งคู่ ไม่พูดรวบว่าสดเท่ากัน
  const ageMin = Math.max(0, Math.round((Date.now() - new Date(DATA.__levelsAt || DATA.generated_at_utc)) / 60000));
  const statMin = Math.max(0, Math.round((Date.now() - new Date(DATA.generated_at_utc)) / 60000));
  el.className = "live " + (liveOk() ? "on" : "off");
  el.textContent = liveOk()
    ? `ราคาสดจาก Binance · อัพเดทล่าสุด ${new Date(LIVE.at).toLocaleTimeString("th-TH", {timeZone: "Asia/Bangkok", hour: "2-digit", minute: "2-digit", second: "2-digit"})} (ทุก 3 วินาที) · ระดับออปชัน ${ageMin} นาทีก่อน · bias / โหมด ${statMin} นาทีก่อน`
    : `ราคาสดใช้ไม่ได้ตอนนี้ — แสดงราคา ณ รอบคำนวณ (${ageMin} นาทีก่อน)`;
}
function onLive() {
  // ทศนิยม 2 ตำแหน่ง + กะพริบเขียว/แดงเมื่อราคาเปลี่ยน — ตลาดเงียบขยับทีละเซนต์ จำนวนเต็มจะดูเหมือนค้าง (MD ทัก 11 ก.ย.)
  document.querySelectorAll("[data-px]").forEach(el => {
    const s = el.dataset.px, d = DATA.symbols[s];
    if (!d) return;
    const p = spotOf(d, s), prev = parseFloat(el.dataset.v);
    el.textContent = fmt(p, 2);
    el.dataset.v = p;
    if (liveOk() && isFinite(prev) && p !== prev) {
      el.classList.remove("flash-up", "flash-dn");
      void el.offsetWidth;   // รีสตาร์ทแอนิเมชัน
      el.classList.add(p > prev ? "flash-up" : "flash-dn");
    }
  });
  document.querySelectorAll("[data-chg]").forEach(el => {
    const s = el.dataset.chg, d = DATA.symbols[s];
    if (!d) return;
    const ch = liveChg(s) ?? d.change_24h;
    el.className = ch >= 0 ? "up" : "dn";
    el.textContent = (ch >= 0 ? "+" : "") + fmt(ch, 2) + "% 24ชม.";
  });
  liveBadge();
  // ผู้ใช้กรอกราคาเอง หรือกำลังพิมพ์อยู่ → ไม่ขยับแผนที่ทับ
  const px = $("#px");
  if (!px || PX[CUR] != null || document.activeElement === px) return;
  px.value = spotOf(DATA.symbols[CUR], CUR).toFixed(CUR === "BTC" ? 0 : 1);
  renderMap();
}

load();
setInterval(load, 10 * 60 * 1000);
startLive();
</script>
</body>
</html>
